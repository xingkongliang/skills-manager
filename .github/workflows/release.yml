name: Build & Release

# Started by version.yml once a version PR merges, or by hand to retry a
# failed release: `gh workflow run release.yml --ref vX.Y.Z`. There is no tag
# trigger on purpose: a hand-pushed tag would skip the version PR and ship a
# build whose version files and changelog disagree with the tag.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # tauri-action creates the release tag itself if it is missing, so a run
  # started on a branch would cut a release from whatever that branch holds.
  check-ref:
    runs-on: ubuntu-latest
    name: Check release tag
    outputs:
      macos_signing: ${{ steps.macos-signing.outputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a tag matching package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref }}" != "refs/tags/v${VERSION}" ]; then
            echo "Run this on the release tag (v${VERSION}), not ${{ github.ref }}:" >&2
            echo "  gh workflow run release.yml --ref v${VERSION}" >&2
            exit 1
          fi

      # With no Apple secrets at all, macOS builds are ad-hoc signed: they run,
      # but Gatekeeper blocks the first launch of a downloaded copy until the
      # user clears the quarantine flag. Setting only some of the secrets is a
      # mistake, not a choice, so it fails instead of quietly going unsigned.
      - name: Choose macOS signing mode
        id: macos-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_BASE64"
          missing=()
          for name in $names; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 6 ]; then
            echo "No Apple secrets set: macOS builds will be ad-hoc signed and not notarized."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -eq 0 ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          else
            echo "Some Apple secrets are set but these are missing: ${missing[*]}" >&2
            echo "Set all of them for Developer ID signing, or none for ad-hoc builds." >&2
            exit 1
          fi

  build:
    needs: check-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})
    # Apple's notary service can leave a submission "In Progress" indefinitely and
    # `notarytool submit --wait` has no timeout of its own, so v1.29.0 burned the
    # full 6-hour GitHub limit on both macOS legs. The slowest healthy build so far
    # is Windows at ~17 minutes, so an hour caps a hang while leaving real headroom.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Restore-only: the post-build cache *save* on Windows intermittently
          # fails (a lingering vctip.exe locks files in target/ while tar/zstd
          # packs the cache), marking an otherwise-successful release job red.
          # Release builds run rarely, so skipping the save avoids the false
          # failure at negligible cost. See v1.22.3 Windows-x64 run.
          save-if: false

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Windows smoke check
        if: matrix.platform == 'windows-latest'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build CLI binary
        run: >-
          cargo build --release
          --manifest-path src-tauri/Cargo.toml
          --bin skills-manager-cli
          --target ${{ matrix.target }}

      - name: Extract changelog for current version
        id: changelog
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Changesets writes "## 1.2.3"; entries from before the fork use
          # "## [1.2.3] - date". Print the body of whichever heading matches.
          BODY=$(awk -v v="$VERSION" '
            /^## / {
              if (found) exit
              h = substr($0, 4); sub(/^\[/, "", h); split(h, a, /[] ]/)
              if (a[1] == v) { found = 1; next }
            }
            found
          ' CHANGELOG.md)
          # Previous tag for the commit range (skip the current tag itself).
          PREV_TAG=$(git tag --sort=-v:refname --merged "${{ github.ref_name }}" | awk -v current="${{ github.ref_name }}" '$0 != current && !found { previous = $0; found = 1 } END { if (found) print previous }')
          if [ -n "$PREV_TAG" ]; then
            FULL_LINE="**Full changes**: [\`${PREV_TAG}...${{ github.ref_name }}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }})"
          else
            FULL_LINE="**Full changes**: initial release"
          fi
          {
            echo "body<<EOF"
            if [ "${{ needs.check-ref.outputs.macos_signing }}" = "adhoc" ]; then
              echo "> **macOS:** this build isn't notarized by Apple, so macOS says it is damaged the first time you open it. After moving it to Applications, run \`xattr -cr /Applications/skills-manager.app\` once. Updates installed from inside the app don't need this."
              echo ""
            fi
            echo "$BODY"
            echo ""
            echo "---"
            echo ""
            echo "${FULL_LINE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Set only the signing variables selected by check-ref. Tauri treats a
      # certificate variable that is set but empty as a certificate to import,
      # and `security import` then fails with "One or more parameters passed to
      # a function were not valid" (v1.41.0-v1.43.0), so ad-hoc mode sets only
      # the identity. check-ref already required every secret in developer-id
      # mode. The notarization key is delivered as base64 because Tauri wants a
      # path to the .p8, not its contents.
      - name: Prepare macOS signing credentials
        if: startsWith(matrix.platform, 'macos')
        env:
          MACOS_SIGNING: ${{ needs.check-ref.outputs.macos_signing }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # "-" makes Tauri sign the bundle ad-hoc; the linker-only signature it
          # would otherwise keep has no sealed resources and reads as damaged.
          if [ "$MACOS_SIGNING" = "adhoc" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          KEY_DIR="$RUNNER_TEMP/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"; then
            echo "APPLE_API_KEY_BASE64 did not decode to a PEM private key" >&2
            exit 1
          fi

          # Heredoc syntax, so no secret value can break out of its entry.
          write_github_env() {
            local name="$1" value="$2" delimiter
            delimiter="TAURI_ENV"
            while [[ "$value" == *"$delimiter"* ]]; do
              delimiter="${delimiter}_"
            done
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_ENV"
          }

          write_github_env APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          write_github_env APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          write_github_env APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          write_github_env APPLE_API_ISSUER "$APPLE_API_ISSUER"
          write_github_env APPLE_API_KEY "$APPLE_API_KEY"
          write_github_env APPLE_API_KEY_PATH "$KEY_PATH"

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The APPLE_* signing and notarization variables come from the previous
          # step via $GITHUB_ENV. They must not be listed here: an expression that
          # evaluates to '' still sets the variable, which Tauri reads as present.
        with:
          tagName: v__VERSION__
          releaseName: "Skills Manager v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.body }}
          # Publish only after every platform is verified. v1.29.0 shipped with
          # Windows and Linux assets while both macOS legs were still notarizing,
          # because assets go public the moment each leg finishes. tauri-action
          # looks a draft up by listing releases, so concurrent matrix legs still
          # converge on one draft rather than creating four.
          releaseDraft: true
          prerelease: false
          updaterJsonKeepUniversal: true
          args: --target ${{ matrix.target }}

      - name: Verify macOS signature and notarization
        if: startsWith(matrix.platform, 'macos')
        env:
          MACOS_SIGNING: ${{ needs.check-ref.outputs.macos_signing }}
        run: |
          set -euo pipefail
          verify_bundle() {
            local label="$1" app="$2"
            echo "=== Verifying $label: $app ==="
            if [ ! -d "$app" ]; then
              echo "Expected app bundle not found at $app" >&2
              return 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app"
            # Capture once and match against the string: piping into `grep -q` lets
            # grep exit first, and the SIGPIPE it sends codesign would surface as a
            # spurious pipeline failure under `set -o pipefail`.
            local sig_info
            sig_info="$(codesign -dvvv "$app" 2>&1)"
            grep -E 'Authority|Signature|Sealed Resources|Identifier|Timestamp' <<<"$sig_info"
            # An ad-hoc build can't pass Gatekeeper, but it must still be a real
            # ad-hoc signature over the whole bundle: the linker-only one has no
            # sealed resources and makes macOS report the app as damaged even
            # after the quarantine flag is cleared.
            if [ "$MACOS_SIGNING" = "adhoc" ]; then
              grep -q 'Signature=adhoc' <<<"$sig_info" || {
                echo "$label is not ad-hoc signed" >&2
                return 1
              }
              grep -qE 'Sealed Resources.*files=[1-9]' <<<"$sig_info" || {
                echo "$label has no sealed resources" >&2
                return 1
              }
              return 0
            fi
            # An unexpected fallback identity still yields a structurally valid
            # signature, so assert the one Gatekeeper actually accepts.
            grep -q 'Authority=Developer ID Application:' <<<"$sig_info" || {
              echo "$label is not signed with a Developer ID Application certificate" >&2
              return 1
            }
            # Notarization is rejected without the hardened runtime, so assert the flag
            # rather than discovering it from a failed submission log.
            grep -qE 'flags=[^)]*runtime' <<<"$sig_info" || {
              echo "Hardened runtime is not enabled on $label" >&2
              return 1
            }
            # The stapled ticket is what lets Gatekeeper approve a downloaded copy
            # offline; spctl is the same check macOS performs on first launch.
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          }

          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          verify_bundle "built bundle" "$BUNDLE_DIR/skills-manager.app"

          # The .app.tar.gz — not the .app or the .dmg — is what the in-app
          # updater downloads and unpacks over the running install, so it is the
          # artifact whose signature and stapled ticket actually decide whether
          # an updated copy still launches. Verifying only the build directory
          # would not catch an archive that lost either one.
          TAR_PATH="$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.app.tar.gz' | head -1)"
          if [ -z "$TAR_PATH" ]; then
            echo "No updater archive (*.app.tar.gz) was produced" >&2
            exit 1
          fi
          EXTRACT_DIR="$(mktemp -d)"
          tar -xzf "$TAR_PATH" -C "$EXTRACT_DIR"
          EXTRACTED_APP="$(find "$EXTRACT_DIR" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$EXTRACTED_APP" ]; then
            echo "No .app found inside $TAR_PATH" >&2
            exit 1
          fi
          verify_bundle "updater archive ($(basename "$TAR_PATH"))" "$EXTRACTED_APP"
          rm -rf "$EXTRACT_DIR"

          # `|| true`: with pipefail a missing dmg directory would abort the step
          # with a bare exit 1 and no diagnostic.
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          DMG_PATH="$(find "$DMG_DIR" -maxdepth 1 -name '*.dmg' 2>/dev/null | head -1 || true)"
          if [ -n "$DMG_PATH" ]; then
            echo "Checking $DMG_PATH (informational: the .app inside carries its own ticket)"
            xcrun stapler validate "$DMG_PATH" || echo "Note: .dmg itself is not stapled"
          fi

      # The linker already ad-hoc signs the CLI, which is all an unsigned
      # build can offer, so there is nothing to do without Developer ID.
      - name: Sign and notarize macOS CLI binary
        if: startsWith(matrix.platform, 'macos') && needs.check-ref.outputs.macos_signing == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/cli-signing-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/cli-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do
            keychain="${keychain#*\"}"
            keychain="${keychain%\"*}"
            if [ -n "$keychain" ]; then
              ORIGINAL_KEYCHAINS+=("$keychain")
            fi
          done < <(security list-keychains -d user)
          cleanup_keychain() {
            if [ "${#ORIGINAL_KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" \
                2>/dev/null || true
            fi
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            rm -f "$CERTIFICATE_PATH"
          }
          trap cleanup_keychain EXIT

          # tauri-action imports the certificate into a temporary keychain that
          # it removes when its own step ends. The standalone CLI is signed in a
          # later step, so install the same certificate into a step-local keychain
          # following GitHub's documented macOS signing pattern.
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          CLI_PATH="src-tauri/target/${{ matrix.target }}/release/skills-manager-cli"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$CLI_PATH"
          codesign --verify --strict --verbose=2 "$CLI_PATH"
          CLI_SIG_INFO="$(codesign -dvvv "$CLI_PATH" 2>&1)"
          grep -E 'Authority|Identifier|Timestamp|flags=' <<<"$CLI_SIG_INFO"
          grep -q 'Authority=Developer ID Application:' <<<"$CLI_SIG_INFO" || {
            echo "CLI is not signed with a Developer ID Application certificate" >&2
            exit 1
          }
          grep -qE 'flags=[^)]*runtime' <<<"$CLI_SIG_INFO" || {
            echo "Hardened runtime is not enabled on the CLI" >&2
            exit 1
          }
          CLI_ARCHIVE="$RUNNER_TEMP/skills-manager-cli-${{ matrix.label }}.zip"
          ditto -c -k --keepParent "$CLI_PATH" "$CLI_ARCHIVE"
          NOTARY_RESULT="$(xcrun notarytool submit "$CLI_ARCHIVE" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --output-format json)"
          printf '%s\n' "$NOTARY_RESULT"
          jq -e '.status == "Accepted"' <<<"$NOTARY_RESULT" >/dev/null || {
            echo "Apple did not accept the CLI notarization submission" >&2
            exit 1
          }
          # A standalone executable cannot carry a stapled ticket, and
          # `spctl --type execute` classifies a bare CLI as "not an app" even
          # after notarization succeeds. The release gate is therefore the
          # verified Developer ID signature plus Apple's explicit Accepted status.

      - name: Upload CLI binary to draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            CLI_PATH="src-tauri/target/${{ matrix.target }}/release/skills-manager-cli.exe"
            CLI_ASSET="skills-manager-cli-${{ matrix.label }}.exe"
          else
            CLI_PATH="src-tauri/target/${{ matrix.target }}/release/skills-manager-cli"
            CLI_ASSET="skills-manager-cli-${{ matrix.label }}"
          fi
          CLI_UPLOAD="$RUNNER_TEMP/$CLI_ASSET"
          cp "$CLI_PATH" "$CLI_UPLOAD"
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            "$CLI_UPLOAD" --clobber

  verify-updater-assets:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Verify updater assets
    steps:
      - name: Validate updater metadata and signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The release is still a draft at this point, and /releases/tags/{tag}
          # returns 404 for drafts, so it has to be located by listing.
          releases_json=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases?per_page=100")

          release_json=$(echo "$releases_json" | jq --arg t "$TAG" '.[] | select(.tag_name == $t)')
          if [ -z "$release_json" ]; then
            echo "No release found for tag ${TAG}" >&2
            exit 1
          fi

          asset_names=$(echo "$release_json" | jq -r '.assets[]?.name')
          echo "Assets on the draft release:"
          echo "$asset_names" | sed 's/^/  /'

          if ! echo "$asset_names" | grep -qx 'latest.json'; then
            echo "Missing updater metadata asset: latest.json" >&2
            exit 1
          fi

          if ! echo "$asset_names" | grep -q '\.sig'; then
            echo "Missing updater signature assets (*.sig)" >&2
            exit 1
          fi

          fail=0
          for cli_asset in \
            skills-manager-cli-macOS-arm64 \
            skills-manager-cli-macOS-x64 \
            skills-manager-cli-Windows-x64.exe \
            skills-manager-cli-Linux-x64; do
            if ! echo "$asset_names" | grep -qx "$cli_asset"; then
              echo "Missing CLI release asset: ${cli_asset}" >&2
              fail=1
            fi
          done

          # Draft assets are not served from the public download host, so fetch
          # latest.json through the authenticated asset endpoint.
          asset_id=$(echo "$release_json" | jq -r '.assets[] | select(.name == "latest.json") | .id')
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${REPO}/releases/assets/${asset_id}" -o /tmp/latest.json

          # v1.29.0 published with no darwin entries at all because only Windows
          # and Linux were asserted here, so every shipped platform is checked now.
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            if ! jq -e --arg p "$platform" '.platforms[$p].signature and .platforms[$p].url' /tmp/latest.json >/dev/null; then
              echo "latest.json is missing a signed updater entry for ${platform}" >&2
              fail=1
            fi
          done

          # A macOS leg that dies during notarization still leaves the release
          # looking plausible, so require its user-facing artifacts too.
          for pattern in '\.dmg$' '\.app\.tar\.gz$'; do
            if ! echo "$asset_names" | grep -qE "$pattern"; then
              echo "Missing macOS asset matching ${pattern}" >&2
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "--- latest.json ---" >&2
            cat /tmp/latest.json >&2
            exit 1
          fi

          echo "Updater assets validation passed"

  publish-release:
    needs: [build, verify-updater-assets]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Publish release
    steps:
      # Every platform built, signed, notarized and verified by this point, so
      # this is the step that actually makes the release visible to users.
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false
          echo "Published ${{ github.ref_name }}"

name: Frontend

# test.yml only runs for src-tauri/**, so a change confined to the frontend
# was otherwise first compiled by the release workflow, at tag time.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    name: Lint and build

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b` is the real type check: the root tsconfig only holds project
      # references, so a bare `tsc --noEmit` checks no source file.
      - name: Build
        run: npm run build
